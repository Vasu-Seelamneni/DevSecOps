<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mutual Funds Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Tahoma,sans-serif;
}

body{
    background:#111827;
    color:white;
}

header{
    padding:30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}

h1{
    font-size:32px;
}

.search{
    width:320px;
}

.search input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:15px;
}

.container{
    width:95%;
    margin:auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:35px;
}

.card{
    background:#1f2937;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
}

.card h2{
    font-size:18px;
    margin-bottom:15px;
    color:#60a5fa;
}

.value{
    font-size:32px;
    font-weight:bold;
}

.positive{
    color:#22c55e;
}

.negative{
    color:#ef4444;
}

.funds{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.fund{
    background:#1f2937;
    border-radius:15px;
    padding:20px;
    transition:.25s;
}

.fund:hover{
    background:#2563eb;
}

.fund h3{
    margin-bottom:6px;
}

.fund .category{
    display:inline-block;
    font-size:12px;
    color:#93c5fd;
    background:rgba(96,165,250,.15);
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:15px;
}

.fund-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:8px;
    font-size:14px;
    color:#d1d5db;
}

.fund-row span:last-child{
    color:white;
    font-weight:600;
}

.returns{
    margin-top:12px;
    font-size:18px;
    font-weight:bold;
}

footer{
    text-align:center;
    color:#888;
    margin:40px;
}
</style>

</head>
<body>

<header>
    <h1>📈 Mutual Funds Portal</h1>

    <div class="search">
        <input type="text" id="search" placeholder="Search Funds...">
    </div>
</header>

<div class="container">

<div class="stats">

<div class="card">
<h2>Total Invested</h2>
<div class="value" id="totalInvested">₹0</div>
</div>

<div class="card">
<h2>Current Value</h2>
<div class="value" id="currentValue">₹0</div>
</div>

<div class="card">
<h2>Overall Gain/Loss</h2>
<div class="value" id="gainLoss">₹0</div>
</div>

<div class="card">
<h2>Overall Returns</h2>
<div class="value" id="returnsPct">0%</div>
</div>

</div>

<h2 style="margin-bottom:20px;">Your Funds</h2>

<div class="funds" id="funds">
<!-- fund cards injected by JS -->
</div>

</div>

<footer>
Running on Apache2 • Mutual Funds Test Application
</footer>

<script>

const funds = [
    { name:"Parag Parikh Flexi Cap Fund",       category:"Flexi Cap",   invested:50000,  nav:78.42 },
    { name:"Mirae Asset Large Cap Fund",         category:"Large Cap",   invested:30000,  nav:112.15 },
    { name:"Quant Small Cap Fund",               category:"Small Cap",   invested:25000,  nav:205.60 },
    { name:"HDFC Mid-Cap Opportunities Fund",    category:"Mid Cap",     invested:40000,  nav:145.30 },
    { name:"ICICI Prudential Balanced Advantage",category:"Hybrid",      invested:20000,  nav:56.90 },
    { name:"SBI Contra Fund",                    category:"Contra",      invested:15000,  nav:88.75 },
    { name:"Nippon India Gold Savings Fund",     category:"Gold",        invested:10000,  nav:23.40 },
    { name:"Axis Bluechip Fund",                 category:"Large Cap",   invested:20000,  nav:64.20 }
];

// Assign a fixed "units" so we can simulate NAV based valuation
funds.forEach(f=>{
    f.units = f.invested / f.nav;
    f.baseNav = f.nav;
});

const fundsContainer = document.getElementById("funds");

function formatCurrency(num){
    return "₹" + Math.round(num).toLocaleString("en-IN");
}

function render(){
    fundsContainer.innerHTML = "";

    let totalInvested = 0;
    let totalCurrent = 0;

    funds.forEach(f=>{
        const currentValue = f.units * f.nav;
        const gain = currentValue - f.invested;
        const gainPct = (gain / f.invested) * 100;

        totalInvested += f.invested;
        totalCurrent += currentValue;

        const cls = gain >= 0 ? "positive" : "negative";
        const sign = gain >= 0 ? "+" : "";

        const card = document.createElement("div");
        card.className = "fund";
        card.innerHTML =
            "<h3>" + f.name + "</h3>" +
            "<span class=\"category\">" + f.category + "</span>" +
            "<div class=\"fund-row\"><span>NAV</span><span>₹" + f.nav.toFixed(2) + "</span></div>" +
            "<div class=\"fund-row\"><span>Invested</span><span>" + formatCurrency(f.invested) + "</span></div>" +
            "<div class=\"fund-row\"><span>Current Value</span><span>" + formatCurrency(currentValue) + "</span></div>" +
            "<div class=\"returns " + cls + "\">" + sign + formatCurrency(gain) + " (" + sign + gainPct.toFixed(2) + "%)</div>";
        fundsContainer.appendChild(card);
    });

    const totalGain = totalCurrent - totalInvested;
    const totalGainPct = (totalGain / totalInvested) * 100;
    const overallCls = totalGain >= 0 ? "positive" : "negative";
    const overallSign = totalGain >= 0 ? "+" : "";

    document.getElementById("totalInvested").innerText = formatCurrency(totalInvested);
    document.getElementById("currentValue").innerText = formatCurrency(totalCurrent);

    const gainLossEl = document.getElementById("gainLoss");
    gainLossEl.innerText = overallSign + formatCurrency(totalGain);
    gainLossEl.className = "value " + overallCls;

    const returnsEl = document.getElementById("returnsPct");
    returnsEl.innerText = overallSign + totalGainPct.toFixed(2) + "%";
    returnsEl.className = "value " + overallCls;
}

render();

// Simulate live NAV fluctuation every 3 seconds (test/demo purposes only)
setInterval(function(){
    funds.forEach(f=>{
        const change = (Math.random()*4 - 2) / 100; // +/-2%
        f.nav = Math.max(1, f.baseNav * (1 + change));
    });
    render();
}, 3000);

// Search/filter
document.getElementById("search").addEventListener("keyup", function(){
    const value = this.value.toLowerCase();
    document.querySelectorAll(".fund").forEach(function(card){
        card.style.display = card.innerText.toLowerCase().includes(value) ? "block" : "none";
    });
});

</script>

</body>
</html>
